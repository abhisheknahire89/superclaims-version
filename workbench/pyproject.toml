[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adjudication-workbench"
version = "0.2.0"
description = "Phase 1 build of the claims adjudication workbench: evidence-linked rule engine, extraction pipeline, review API and reviewer UI (synthetic data only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - internal" }
# Versions below are the ones this build was tested with on macOS (Python 3.13.15, 12 Oct 2026). ADR-13.
dependencies = [
  "fastapi==0.143.0",
  "starlette==1.6.0",
  "uvicorn==0.53.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "jsonschema==4.26.0",
  "referencing==0.37.0",
  "PyYAML==6.0.3",
  "pdfplumber==0.11.10",
  "pypdfium2==5.13.0",
  "reportlab==5.0.1",
  "numpy==2.5.4",
  "opencv-python-headless==5.0.0.93",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
# Browser tests (tests/e2e.py, tests/ui_smoke.py). Tested with playwright 1.63.0 and Chromium build 1243.
ui-test = ["playwright==1.63.0"]
# Bedrock extraction provider: an interface for a paid service, built but never run (ADR-12.3, ADR-14).
bedrock = ["boto3>=1.34"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aw = ["web/*"]
