[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adjudication-workbench"
version = "0.1.0"
description = "Phase 1 build of the claims adjudication workbench: evidence-linked rule engine, extraction pipeline, review API and reviewer UI (synthetic data only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - internal" }
# Versions below are the ones the Phase 1 build was tested with (Python 3.13.16, 10-11 Oct 2026).
dependencies = [
  "starlette==1.6.0",
  "uvicorn==0.53.0",
  "pydantic==2.13.5",
  "jsonschema==4.26.0",
  "referencing==0.37.0",
  "PyYAML==6.0.3",
  "pdfplumber==0.11.10",
  "pypdfium2==5.13.0",
  "reportlab==5.0.1",
]

[project.optional-dependencies]
# Production database driver. NOT yet exercised: without it the stdlib wire client in aw/db/pgwire.py is used (ADR-12.2).
postgres = ["psycopg[binary]>=3.2,<4"]
# Browser smoke test (tests/ui_smoke.py). Tested with playwright 1.56.0 and Chromium build 1194.
ui-test = ["playwright==1.56.0"]
# Bedrock extraction provider. NOT yet exercised (ADR-12.3).
bedrock = ["boto3>=1.34"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aw = ["web/*"]
