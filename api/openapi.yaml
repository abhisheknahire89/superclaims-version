        '200':
          description: Local operation response
        '403':
          description: Role denied

  /queries/{query_id}/letter:
    parameters: [{name: query_id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: exportQueryLetter
      summary: exportQueryLetter
      parameters: []
      responses:
        '200':
          description: Local operation response
        '403':
          description: Role denied
  /admin/users:
    get:
      operationId: listLocalUsers
      summary: listLocalUsers
      parameters: []
      responses:
        '200':
          description: Local operation response
        '403':
          description: Role denied
    post:
      operationId: saveLocalUser
      summary: saveLocalUser
      parameters:
      - &id001
        $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Local operation response
        '403':
          description: Role denied
      requestBody:
        required: true
