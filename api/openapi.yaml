webhooks:
  claim.evaluation.completed:
    post:
      summary: Sent when an evaluation reaches COMPUTED or BLOCKED
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookEvent'}
            examples:
              computed:
                value:
                  event_id: 01J9Z3K7D2V0XQ3W5M8N4T6R2A
                  event_type: claim.evaluation.completed
                  occurred_at: '2026-07-09T11:31:47+05:30'
                  tenant_id: TENANT-DEMO
                  claim_id: CLM-DEMO-0002
                  data: {evaluation_id: EVAL-0002-v1, recommendation: PAY_PARTIAL, recommended_payable: '85000.00'}
      responses:
        '2XX': {description: Receiver accepted. Non-2XX or timeout (10 s) triggers retry with exponential backoff for 24 h, then dead-letter.}
  claim.decision.recorded:
    post:
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookEvent'}
      responses:
        '2XX': {description: Accepted}
  claim.query.approved:
    post:
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookEvent'}
      responses:
        '2XX': {description: Accepted}

components:
  securitySchemes:
    oauth2ClientCredentials:
      type: oauth2
      description: System-to-system (TMS adapter). Tokens are tenant-scoped; mTLS recommended for production.
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.invalid/oauth2/token
          scopes:
            claims.read: Read claims, evaluations and audit
            claims.write: Create claims, upload documents, record decisions
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token for reviewer UI sessions; roles come from the customer's IdP group mapping.
  headers:
    ETag:
      schema: {type: string}
      description: Opaque version of the claim; send back in If-Match.
  parameters:
    ClaimId: {name: claim_id, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
  responses:
    NotFound: {description: Not found, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Conflict: {description: Conflict (idempotency key reuse with different body, or state conflict), content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Unprocessable: {description: Validation failed, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    PreconditionFailed: {description: ETag mismatch — the claim changed; re-read and retry, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Forbidden: {description: Role or approval limit does not permit this action, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  schemas:
    Money: {type: string, pattern: '^[0-9]+\.[0-9]{2}$'}
    ArtifactKind: {enum: [POLICY_CONFIG, NME_LIST, TARIFF, CHECKLIST, WORKFLOW_CONFIG, RULE_PACK, CLASSIFIER_MAP]}
    Workflow: {enum: [PREAUTH, ENHANCEMENT, CASHLESS_DISCHARGE, IPD_REIMBURSEMENT, OPD_REIMBURSEMENT, OPD_CASHLESS]}
    ClaimStatus: {enum: [INTAKE, DOCS_INCOMPLETE, PROCESSING, READY_FOR_REVIEW, IN_REVIEW, MEDICAL_REVIEW, QUERY_RAISED, AWAITING_RESPONSE, PENDING_APPROVAL, ESCALATED_CRC, FINALISED, EXPORTED, REOPENED, WITHDRAWN]}
    DocumentType: {enum: [ESTIMATE_BILL, CLAIM_FORM, DISCHARGE_SUMMARY, FINAL_BILL_ITEMISED, FINAL_BILL_SUMMARY, PHARMACY_BILL, INVESTIGATION_REPORT, ADMISSION_RECORD, PRESCRIPTION, PAYMENT_RECEIPT, ID_PROOF, BANK_DETAILS, PREAUTH_REQUEST, IMPLANT_INVOICE, PAST_TREATMENT_RECORDS, PROPOSAL_FORM, OTHER]}
    ClaimCreate:
      type: object
      required: [external_ref, workflow, policy_no, member_id]
      additionalProperties: false
      properties:
        external_ref: {type: string, maxLength: 64}
        workflow: {$ref: '#/components/schemas/Workflow'}
        policy_no: {type: string}
        member_id: {type: string}
        hospital_id: {type: [string, 'null']}
        admission_date: {type: [string, 'null'], format: date}
        discharge_date: {type: [string, 'null'], format: date}
        parent_claim_id: {type: [string, 'null']}
        claimed_amount: {$ref: '#/components/schemas/Money'}
    ClaimSummary:
      type: object
      required: [claim_id, external_ref, workflow, status]
      properties:
        claim_id: {type: string}
        external_ref: {type: string}
        workflow: {$ref: '#/components/schemas/Workflow'}
        status: {$ref: '#/components/schemas/ClaimStatus'}
        recommendation: {type: [string, 'null']}
        recommended_payable: {type: [string, 'null']}
        open_blocking_findings: {type: integer, minimum: 0}
        sla_due_at: {type: [string, 'null'], format: date-time}
        assigned_to: {type: [string, 'null']}
    Claim:
      allOf:
        - $ref: '#/components/schemas/ClaimSummary'
        - type: object
          properties:
            policy_no: {type: string}
            member_id: {type: string}
            hospital_id: {type: [string, 'null']}
            admission_date: {type: [string, 'null'], format: date}
            discharge_date: {type: [string, 'null'], format: date}
            current_evaluation_id: {type: [string, 'null']}
    Document:
      type: object
      required: [document_id, status]
      properties:
        document_id: {type: string}
        declared_type: {$ref: '#/components/schemas/DocumentType'}
        classified_type: {type: [string, 'null']}
        status: {enum: [RECEIVED, STORED, CLASSIFYING, CLASSIFIED, EXTRACTING, EXTRACTED, NEEDS_REVIEW, FAILED_UNREADABLE, FAILED_TECHNICAL, QUARANTINED, SUPERSEDED]}
        page_count: {type: [integer, 'null']}
        sha256: {type: string}
        supersedes_document_id: {type: [string, 'null']}
    ReviewerActionCreate:
      type: object
      required: [action, target, reason_code]
      properties:
        action: {enum: [CORRECT_FACT, RESOLVE_CONFLICT, RECLASSIFY_LINE, RECLASSIFY_DOCUMENT, MARK_PAGE_UNREADABLE, OVERRIDE_ADJUSTMENT, ADD_ADJUSTMENT, REMOVE_ADJUSTMENT, ACKNOWLEDGE_FINDING, RESOLVE_FINDING, DISMISS_FINDING, RETURN_FOR_REWORK, ESCALATE_MEDICAL, ESCALATE_CRC, ESCALATE_FWA, PLACE_INVESTIGATION_HOLD, RELEASE_INVESTIGATION_HOLD, RECORD_CRC_DECLINED]}
        evaluation_id: {type: string}
        target:
          type: object
          required: [type, id]
          properties:
            type: {enum: [fact, conflict, bill_line, adjustment, finding, document, page, claim]}
            id: {type: string}
        after_value: {type: object}
        reason_code: {type: string}
        comment: {type: string, maxLength: 2000}
      allOf:
        - if: {properties: {action: {enum: [OVERRIDE_ADJUSTMENT, ADD_ADJUSTMENT, REMOVE_ADJUSTMENT, DISMISS_FINDING]}}}
          then: {required: [comment]}
    DecisionCreate:
      type: object
      required: [evaluation_id, disposition]
      properties:
        evaluation_id: {type: string}
        disposition: {enum: [APPROVED_FULL, APPROVED_PARTIAL, REPUDIATED_WITH_CRC_APPROVAL, WITHDRAWN, CLOSED_DUPLICATE]}
        approved_payable: {$ref: '#/components/schemas/Money'}
        crc_reference: {type: [string, 'null']}
        communicated_by: {enum: [INSURER, TPA], default: TPA, description: Repudiation is recorded as the insurer's outcome and communicated only by the insurer (E-REG-04)}
        duplicate_of_claim_id: {type: [string, 'null']}
        deviation_reason: {type: [string, 'null']}
      allOf:
        - if: {properties: {disposition: {const: REPUDIATED_WITH_CRC_APPROVAL}}}
          then: {required: [crc_reference, communicated_by], properties: {communicated_by: {const: INSURER}}}
        - if: {properties: {disposition: {const: CLOSED_DUPLICATE}}}
          then: {required: [duplicate_of_claim_id]}
        - if: {properties: {disposition: {enum: [APPROVED_FULL, APPROVED_PARTIAL]}}}
          then: {required: [approved_payable]}
    Decision:
      allOf:
        - $ref: '#/components/schemas/DecisionCreate'
        - type: object
          required: [decision_id, decided_by, decided_at]
          properties:
            decision_id: {type: string}
            decided_by: {type: string}
            decided_at: {type: string, format: date-time}
    AuditEvent:
      type: object
      required: [seq, occurred_at, actor, event_type, payload, prev_hash, event_hash]
      properties:
        seq: {type: integer}
        claim_id: {type: string}
        occurred_at: {type: string, format: date-time}
        actor: {type: string}
        event_type: {type: string}
        payload: {type: object}
        prev_hash: {type: string}
        event_hash: {type: string}
    WebhookEvent:
      type: object
      required: [event_id, event_type, occurred_at, tenant_id, data]
      properties:
        event_id: {type: string, description: Unique; receivers must de-duplicate on it (delivery is at-least-once)}
        event_type: {type: string}
        occurred_at: {type: string, format: date-time}
        tenant_id: {type: string}
        claim_id: {type: string}
        data: {type: object}
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              pointer: {type: string}
              message: {type: string}
