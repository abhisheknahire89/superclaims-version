            schema:
              type: object
              additionalProperties: false
              required: [action, target]
              properties:
                action: {enum: [intake_source, verify_source, extract_rules, revise_rule, validate_rule, review_rule, approve_rule, publish_rule, preview, propose_product_history, approve_product_history, reject_research, resolve_research]}
                target: {type: string, minLength: 1, maxLength: 200}
                data: {type: object}
      responses:
