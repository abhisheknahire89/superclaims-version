          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                user_id:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{1,64}$
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 128
                is_active:
                  type: boolean
                roles:
                  type: array
                  uniqueItems: true
                  minItems: 1
                  items:
                    enum:
                    - PROCESSOR
                    - MEDICAL_OFFICER
                    - SUPERVISOR
                    - AUDITOR
                    - FWA_ANALYST
                    - CONFIG_ADMIN
                    - TENANT_ADMIN
                    - READ_ONLY
                approval_limit:
                  type:
                  - string
                  - 'null'
                  pattern: ^[0-9]+\.[0-9]{2}$
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
                current_password:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
              - user_id
              - display_name
              - is_active
              - roles
              - current_password
  /queries/{query_id}:answer:
    parameters: [{name: query_id, in: path, required: true, schema: {type: string}}]
    post:
      operationId: answerQuery
